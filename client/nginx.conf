server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 作文正文最多 5000 字符，1m 足够，留点余量给 JSON 转义
    client_max_body_size 2m;

    # 静态资源压缩：Vue 的 JS 包压缩后体积能掉 60% 以上
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ── 接口反向代理 ──────────────────────────────────────────
    location /api/ {
        # 结尾不带斜杠 = 原样转发 /api/xxx，后端路由就是挂在 /api 下的
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式批改的关键四行：
        # 不缓冲（否则要等全部生成完才一次性吐出）、缓存关掉、
        # 连接保持、超时给够（模型慢的时候不会中途被掐断）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 带 hash 的构建产物：强缓存一年 ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 前端路由用 history 模式，刷新页面要回落到 index.html ──
    location / {
        # index.html 绝不缓存，否则发版后用户还拿着旧壳子
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
