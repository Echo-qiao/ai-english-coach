# 一条命令起全套：MySQL + 后端 API + 前端 Nginx
#
# 首次使用：
#   cp .env.example .env        # 然后改掉里面的密码
#   docker compose up -d --build
#
# 访问：http://localhost:8080        前端
#       http://localhost:3000/health 后端直连（排查用）
#       localhost:3307               宿主上的数据库端口（Navicat/DataGrip 连这个）

services:
  mysql:
    image: mysql:8.0
    container_name: coach-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_english_coach}
      TZ: Asia/Shanghai
    ports:
      # 宿主侧用 3307，因为本机 MySQL80 服务已经占着 3306，
      # 直接映射 3306 会报 "port is already allocated" 起不来。
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 注意 $$ 是 compose 的转义：容器里才会展开成 $MYSQL_ROOT_PASSWORD
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      # MySQL 首次初始化数据目录要几十秒，这段时间内的失败不算数
      start_period: 30s

  api:
    build:
      context: ./server
    container_name: coach-api
    restart: unless-stopped
    environment:
      # 容器之间用服务名互相访问：主机名是 mysql，不是 localhost
      # 密码只能包含字母数字，否则要写成 %40 这种 URL 编码形式
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:-ai_english_coach}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 里设置 JWT_SECRET}
      PORT: "3000"
      TZ: Asia/Shanghai
      # 想接真实模型就取消下面三行注释（不填则走模拟流式输出，功能完整）
      # OPENAI_API_KEY: "sk-xxxx"
      # OPENAI_BASE_URL: "https://api.deepseek.com/v1"
      # OPENAI_MODEL: "deepseek-chat"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # node 22 自带 fetch，不用额外装 curl
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./client
    container_name: coach-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
    depends_on:
      api:
        # 等 API 真正能响应再起 Nginx，否则首屏一打开就是 502
        condition: service_healthy

volumes:
  mysql_data:
